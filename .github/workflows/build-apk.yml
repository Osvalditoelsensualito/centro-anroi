name: Build Centro APK

# Este workflow compila la APK de Android de forma automática en los servidores de GitHub
# (que sí tienen acceso completo a los repositorios de Google/Android). Se ejecuta en cada
# push a main/master y también se puede lanzar manualmente desde la pestaña "Actions".
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm ci

      - name: Sync Capacitor web assets into the Android project
        run: npx cap copy android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: centro-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # ---- Compilación de APK release SIN FIRMAR (opcional) ----
      # Para instalar directamente en un teléfono conviene usar la APK "debug" de arriba,
      # que ya viene firmada automáticamente con una clave de depuración y se instala sin problemas.
      # Si más adelante quieres publicarla en Play Store necesitarás firmarla con tu propia clave
      # de release (keystore), lo cual no se hace aquí por seguridad (nunca subas tu keystore
      # o contraseñas al repositorio).
      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: centro-release-apk-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
